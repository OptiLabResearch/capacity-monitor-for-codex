name: Bug report
description: Report a reproducible problem without sharing secrets
body:
  - type: textarea
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
  - type: textarea
    attributes:
      label: Sanitized diagnostics
      description: Use Copy diagnostics. Remove anything sensitive before posting. Never paste tokens, cookies, bot tokens, webhook URLs, or relay secrets.
  - type: input
    attributes:
      label: Extension version
